version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Ljubljana
    allow:
      - dependency-name: nixpkgs
      - dependency-name: disko
      - dependency-name: sops-nix
    groups:
      host-packages:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /stacks/**
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Ljubljana
    open-pull-requests-limit: 10
    ignore:
      # The HA Tablet build pipeline owns this image pin.
      - dependency-name: git.lesicnik.eu/david/ha-tablet
      # The HA Phone build pipeline owns this image pin.
      - dependency-name: git.lesicnik.eu/david/ha-phone
      # PostgreSQL majors stay at each stack's migrated version.
      - dependency-name: library/postgres
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Ljubljana
    groups:
      github-actions:
        patterns: ["*"]
