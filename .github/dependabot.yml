version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Ljubljana
    allow:
      - dependency-name: nixpkgs
      - dependency-name: disko
      - dependency-name: sops-nix
    groups:
      host-packages:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /stacks/**
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Ljubljana
    open-pull-requests-limit: 10
    ignore:
      # The HA Tablet build pipeline owns this image pin.
      - dependency-name: git.lesicnik.eu/david/ha-tablet
      # PostgreSQL major upgrades require an explicit database migration.
      - dependency-name: library/postgres
        versions: [">=17"]
