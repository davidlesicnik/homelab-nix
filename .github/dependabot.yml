version: 2
updates:
  - package-ecosystem: nix
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Ljubljana
    allow:
      - dependency-name: nixpkgs
      - dependency-name: disko
      - dependency-name: sops-nix
    groups:
      host-packages:
        patterns: ["*"]
  - package-ecosystem: docker
    directories:
      - /stacks/**
    exclude-paths:
      - /stacks/lubelogger/**
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Ljubljana
    open-pull-requests-limit: 10
    ignore:
      # The HA Tablet build pipeline owns this image pin.
      - dependency-name: git.lesicnik.eu/david/ha-tablet
      # The HA Phone build pipeline owns this image pin.
      - dependency-name: git.lesicnik.eu/david/ha-phone
      # Litara stays on PostgreSQL 16; major upgrades require migration.
      - dependency-name: library/postgres
        versions: [">=17"]
  - package-ecosystem: docker
    directory: /stacks/lubelogger
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Ljubljana
    ignore:
      # Keep the migrated PostgreSQL 18 major version.
      - dependency-name: library/postgres
        versions: [">=19"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Ljubljana
    groups:
      github-actions:
        patterns: ["*"]
