name: Caddy checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caddy-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Test updater failure handling
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Evaluate host and build Caddy with configuration validation
        run: |
          nix flake check --no-build --all-systems
          nix build --no-link --print-build-logs .#caddy-image .#checks.x86_64-linux.caddy-config
