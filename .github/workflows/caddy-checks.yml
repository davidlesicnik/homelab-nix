name: Nix checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: caddy-checks-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
      - name: Check whether Caddy build inputs changed
        id: caddy
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          build=$(python3 scripts/caddy-build-required.py)
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - name: Lint workflows and shell scripts
        run: |
          nix shell --inputs-from . nixpkgs#actionlint nixpkgs#shellcheck --command bash -euo pipefail -c '
            actionlint
            shellcheck -x scripts/*.sh tests/*.sh
          '
      - name: Test disk initialization guards
        run: bash tests/initialize-container-disk.sh
      - name: Test updater failure handling
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validate Nix configuration
        run: |
          nix flake check --no-build --all-systems
          nix eval --raw .#nixosConfigurations.podman.config.system.build.toplevel.drvPath
          nix eval --raw .#packages.x86_64-linux.plex-lxc.drvPath
      - name: Build Caddy and validate its configuration
        if: steps.caddy.outputs.build == 'true'
        run: |
          nix build --no-link --print-build-logs .#caddy-image .#checks.x86_64-linux.caddy-config
